name: charging-sound release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build and publish, e.g. v0.2.0"
        type: string
        required: true
      publish:
        description: "Upload to the release and attest; false only builds and verifies"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # act passes boolean inputs as strings, and 'false' is truthy in an expression.
      PUBLISH: ${{ format('{0}', inputs.publish) }}
    steps:
      - name: Check out the release tag
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Check out the current ref (dry run)
        if: ${{ env.PUBLISH != 'true' }}
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "CHARGING_SOUND_KEYSTORE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          CHARGING_SOUND_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHARGING_SOUND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHARGING_SOUND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Name, verify and checksum
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/charging-sound-${TAG}.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "dist/charging-sound-${TAG}.apk"
          cd dist
          sha256sum "charging-sound-${TAG}.apk" | tee SHA256SUMS

      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/charging-sound-*.apk

      - name: Upload to the release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "dist/charging-sound-${TAG}.apk" dist/SHA256SUMS --clobber
