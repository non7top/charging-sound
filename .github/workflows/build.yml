name: charging-sound build

# No push trigger: master requires a PR, so every commit on master was already built here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Lint, test and build
        run: ./gradlew --no-daemon --console=plain lintDebug testDebugUnitTest assembleDebug

      # act's artifact server does not speak the v4+ upload protocol.
      - name: Upload debug APK
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: charging-sound-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
